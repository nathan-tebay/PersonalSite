<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Blog Admin — Tebay.dev</title>
  <script>
    if (!document.cookie.split(';').some(function(c){return c.trim().startsWith('admin_ui=1')}))
      window.location.replace('/cgi-bin/login.cgi')
  </script>
    <link rel="icon" type="image/png" href="../favicon.png" />
    <link rel="stylesheet" href="../assets/style.css" />
    <link rel="stylesheet" href="../assets/blog-post.css" />
    <style>
      :root {
        --danger:   #f87171;
        --warning:  #fbbf24;
        --input-bg: rgba(0, 0, 0, 0.25);
      }

      /* ── Admin panel fills the main column ───────────────────────────── */
      #admin-panel {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      /* ── Toolbar ──────────────────────────────────────────────────────── */
      #admin-toolbar {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding-bottom: 0.85rem;
        border-bottom: 1px solid var(--divider);
      }

      #admin-toolbar h2 { font-size: 0.95rem; font-weight: 600; flex: 1; color: var(--text-high); }

      #logout-btn {
        background: none;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 0.3rem;
        color: var(--text-mid);
        cursor: pointer;
        font-family: system-ui, sans-serif;
        font-size: 0.78rem;
        padding: 0.2rem 0.65rem;
        transition: color 0.12s, border-color 0.12s;
      }

      #logout-btn:hover { color: var(--text-high); border-color: rgba(255, 255, 255, 0.3); }

      /* ── Two-column editor ────────────────────────────────────────────── */
      #editor-layout {
        display: grid;
        grid-template-columns: 220px 1fr;
        gap: 1rem;
        min-height: 520px;
      }

      /* ── Post list ────────────────────────────────────────────────────── */
      #post-list {
        background: rgba(0, 0, 0, 0.15);
        border: 1px solid var(--divider);
        border-radius: 0.5rem;
        overflow-y: auto;
        padding: 0.75rem;
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
      }

      .list-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 0.5rem;
        margin-bottom: 0.15rem;
        border-bottom: 1px solid var(--divider);
      }

      .list-header span {
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-low);
      }

      #new-btn {
        background: none;
        color: var(--text-link);
        border: 1px solid var(--text-link);
        border-radius: 0.3rem;
        cursor: pointer;
        font-family: system-ui, sans-serif;
        font-size: 0.7rem;
        font-weight: 700;
        padding: 0.15rem 0.5rem;
        letter-spacing: 0.04em;
        transition: opacity 0.12s;
      }

      #new-btn:hover { opacity: 0.75; }

      .post-item {
        padding: 0.45rem 0.55rem;
        border-radius: 0.4rem;
        cursor: pointer;
        transition: background 0.1s;
      }

      .post-item:hover  { background: var(--hover-bg); }
      .post-item.active { background: rgba(74, 222, 128, 0.1); }

      .post-item-row {
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .post-item-title { font-size: 0.82rem; color: var(--text-high); flex: 1; }
      .post-item-date  { font-size: 0.7rem; color: var(--text-low); margin-top: 0.1rem; }

      .badge {
        font-size: 0.6rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        border-radius: 0.25rem;
        padding: 0.1rem 0.35rem;
        flex-shrink: 0;
      }

      .badge--published { color: var(--text-link);  background: rgba(74, 222, 128, 0.12); }
      .badge--draft     { color: var(--warning);     background: rgba(251, 191, 36, 0.12); }

      /* ── Editor panel ─────────────────────────────────────────────────── */
      #editor-panel {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        min-width: 0;
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }

      .form-group label {
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-low);
      }

      .form-group input,
      .form-group textarea {
        background: var(--input-bg);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 0.4rem;
        color: var(--text-high);
        font-family: system-ui, sans-serif;
        font-size: 0.85rem;
        padding: 0.45rem 0.65rem;
        outline: none;
        transition: border-color 0.12s;
        width: 100%;
      }

      .form-group input:focus,
      .form-group textarea:focus { border-color: var(--text-link); }

      .form-group input[type="password"] { letter-spacing: 0.1em; }

      .form-group textarea {
        font-family: 'Courier New', monospace;
        font-size: 0.82rem;
        resize: vertical;
        min-height: 300px;
        line-height: 1.55;
      }

      /* ── Write / Preview tabs ─────────────────────────────────────────── */
      .tabs {
        display: flex;
        gap: 0.4rem;
        border-bottom: 1px solid var(--divider);
        margin-bottom: 0.5rem;
      }

      .tab-btn {
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        color: var(--text-mid);
        cursor: pointer;
        font-family: system-ui, sans-serif;
        font-size: 0.8rem;
        padding: 0.35rem 0.6rem;
        margin-bottom: -1px;
        transition: color 0.12s, border-color 0.12s;
      }

      .tab-btn.active { color: var(--text-high); border-bottom-color: var(--text-link); }

      #preview-pane {
        display: none;
        background: var(--input-bg);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 0.4rem;
        padding: 1.25rem;
        min-height: 300px;
        line-height: 1.7;
      }

      #preview-pane h1, #preview-pane h2, #preview-pane h3 {
        color: var(--text-high); margin: 1rem 0 0.5rem; font-weight: 600;
      }

      #preview-pane p    { font-size: 0.85rem; margin-bottom: 0.75rem; color: var(--text-mid); }
      #preview-pane a    { color: var(--text-link); }
      #preview-pane code { font-family: monospace; background: rgba(0,0,0,0.35); padding: 0.1em 0.3em; border-radius: 0.2em; font-size: 0.85em; }
      #preview-pane pre  { background: rgba(0,0,0,0.35); padding: 1rem; border-radius: 0.4rem; overflow-x: auto; margin-bottom: 0.75rem; font-size: 0.82rem; }

      /* ── Action buttons ───────────────────────────────────────────────── */
      .btn-row {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        flex-wrap: wrap;
      }

      button.primary {
        background: var(--text-link);
        color: #0a1a0f;
        border: none;
        border-radius: 0.4rem;
        cursor: pointer;
        font-family: system-ui, sans-serif;
        font-size: 0.82rem;
        font-weight: 700;
        padding: 0.5rem 1.25rem;
        transition: opacity 0.12s;
      }

      button.primary:hover { opacity: 0.85; }

      button.secondary {
        background: none;
        color: var(--text-mid);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 0.4rem;
        cursor: pointer;
        font-family: system-ui, sans-serif;
        font-size: 0.82rem;
        padding: 0.5rem 1rem;
        transition: color 0.12s, border-color 0.12s;
      }

      button.secondary:hover { color: var(--text-high); border-color: rgba(255, 255, 255, 0.3); }

      button.danger {
        background: none;
        color: var(--danger);
        border: 1px solid var(--danger);
        border-radius: 0.4rem;
        cursor: pointer;
        font-family: system-ui, sans-serif;
        font-size: 0.82rem;
        padding: 0.5rem 1rem;
        transition: opacity 0.12s;
      }

      button.danger:hover { opacity: 0.75; }

      /* ── Image section ─────────────────────────────────────────────── */
      #img-section {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .img-section-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .img-upload-label {
        background: none;
        color: var(--text-link);
        border: 1px solid var(--text-link);
        border-radius: 0.3rem;
        cursor: pointer;
        font-family: system-ui, sans-serif;
        font-size: 0.7rem;
        font-weight: 700;
        padding: 0.15rem 0.5rem;
        letter-spacing: 0.04em;
        transition: opacity 0.12s;
        user-select: none;
      }

      .img-upload-label:hover { opacity: 0.75; }

      #img-drop-zone {
        border: 1px dashed rgba(255,255,255,0.2);
        border-radius: 0.4rem;
        padding: 0.6rem 1rem;
        text-align: center;
        font-size: 0.78rem;
        color: var(--text-low);
        cursor: pointer;
        transition: border-color 0.12s, background 0.12s;
      }

      #img-drop-zone.drag-over {
        border-color: var(--text-link);
        background: rgba(74, 222, 128, 0.06);
        color: var(--text-mid);
      }

      #img-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .img-thumb {
        position: relative;
        width: 72px;
        cursor: grab;
        border-radius: 0.35rem;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.1);
        transition: border-color 0.12s;
      }

      .img-thumb:hover { border-color: rgba(255,255,255,0.3); }

      .img-thumb img {
        width: 100%;
        height: 52px;
        object-fit: cover;
        display: block;
      }

      .img-thumb-name {
        font-size: 0.6rem;
        color: var(--text-low);
        padding: 0.2rem 0.3rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        background: var(--input-bg);
      }

      .img-thumb-del {
        position: absolute;
        top: 2px;
        right: 2px;
        background: rgba(0,0,0,0.65);
        border: none;
        border-radius: 50%;
        color: var(--danger);
        cursor: pointer;
        font-size: 0.65rem;
        line-height: 1;
        padding: 0.15rem 0.3rem;
        opacity: 0;
        transition: opacity 0.12s;
      }

      .img-thumb:hover .img-thumb-del { opacity: 1; }

      /* ── WIP checkbox ─────────────────────────────────────────────────── */
      .checkbox-label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.82rem;
        color: var(--text-mid);
        cursor: pointer;
        user-select: none;
      }

      .checkbox-label input[type="checkbox"] {
        width: 1rem;
        height: 1rem;
        accent-color: var(--warning);
        cursor: pointer;
      }

      #publish-btn {
        background: none;
        border: 1px solid;
        border-radius: 0.4rem;
        cursor: pointer;
        font-family: system-ui, sans-serif;
        font-size: 0.82rem;
        font-weight: 600;
        padding: 0.5rem 1rem;
        transition: opacity 0.12s;
      }

      #publish-btn.state-draft     { color: var(--text-link); border-color: var(--text-link); }
      #publish-btn.state-published { color: var(--warning);   border-color: var(--warning); }
      #publish-btn:hover { opacity: 0.75; }

      #status {
        font-size: 0.8rem;
        min-height: 1.2em;
        color: var(--text-link);
      }

      /* ── Admin section tabs ───────────────────────────────────────────── */
      #admin-section-tabs {
        display: flex;
        gap: 0;
        border-bottom: 1px solid var(--divider);
      }

      .admin-stab {
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        color: var(--text-mid);
        cursor: pointer;
        font-family: system-ui, sans-serif;
        font-size: 0.85rem;
        font-weight: 600;
        padding: 0.45rem 1.1rem;
        margin-bottom: -1px;
        transition: color 0.12s, border-color 0.12s;
      }

      .admin-stab.active { color: var(--text-high); border-bottom-color: var(--text-link); }

      /* ── Links editor ────────────────────────────────────────────────── */
      #links-layout {
        display: grid;
        grid-template-columns: 190px 1fr;
        gap: 1rem;
        min-height: 400px;
      }

      #cat-panel {
        background: rgba(0, 0, 0, 0.15);
        border: 1px solid var(--divider);
        border-radius: 0.5rem;
        padding: 0.75rem;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        overflow-y: auto;
      }

      #links-main {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        min-width: 0;
      }

      #links-list {
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
        overflow-y: auto;
        flex: 1;
      }

      .cat-row {
        display: flex;
        gap: 0.35rem;
        align-items: center;
      }

      .cat-row input {
        flex: 1;
        min-width: 0;
        background: var(--input-bg);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 0.35rem;
        color: var(--text-high);
        font-family: system-ui, sans-serif;
        font-size: 0.8rem;
        padding: 0.3rem 0.45rem;
        outline: none;
        transition: border-color 0.12s;
      }

      .cat-row input:focus { border-color: var(--text-link); }

      .cat-move-btns {
        display: flex;
        flex-direction: column;
        gap: 0.1rem;
        flex-shrink: 0;
      }

      .cat-move-btn {
        background: none;
        border: none;
        color: var(--text-low);
        cursor: pointer;
        font-size: 0.6rem;
        line-height: 1;
        padding: 0 0.15rem;
        transition: color 0.12s;
      }

      .cat-move-btn:hover { color: var(--text-high); }

      .link-card {
        background: rgba(0, 0, 0, 0.15);
        border: 1px solid var(--divider);
        border-radius: 0.45rem;
        padding: 0.6rem 0.75rem;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }

      .link-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.4rem;
      }

      .link-card-footer {
        display: flex;
        gap: 0.4rem;
        align-items: center;
      }

      .link-input {
        background: var(--input-bg);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 0.35rem;
        color: var(--text-high);
        font-family: system-ui, sans-serif;
        font-size: 0.8rem;
        padding: 0.3rem 0.45rem;
        outline: none;
        width: 100%;
        box-sizing: border-box;
        transition: border-color 0.12s;
      }

      .link-input:focus { border-color: var(--text-link); }

      textarea.link-input {
        resize: vertical;
        min-height: 3.5rem;
        line-height: 1.4;
      }

      .link-select {
        flex: 1;
        min-width: 0;
        background: var(--input-bg);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 0.35rem;
        color: var(--text-high);
        font-family: system-ui, sans-serif;
        font-size: 0.8rem;
        padding: 0.3rem 0.45rem;
        outline: none;
      }

      .icon-btn {
        background: none;
        border: 1px solid currentColor;
        border-radius: 0.25rem;
        cursor: pointer;
        font-family: system-ui, sans-serif;
        font-size: 0.75rem;
        line-height: 1;
        padding: 0.2rem 0.45rem;
        flex-shrink: 0;
        transition: opacity 0.12s;
      }

      .icon-btn.danger { color: var(--danger); }
      .icon-btn:hover { opacity: 0.7; }

      #links-status {
        font-size: 0.8rem;
        min-height: 1.2em;
        color: var(--text-link);
      }

      /* ── Responsive: stack editor on small screens ────────────────────── */
      @media (max-width: 700px) {
        #editor-layout { grid-template-columns: 1fr; }
        #analytics-summary { grid-template-columns: repeat(2, 1fr); }
        #analytics-tables  { grid-template-columns: 1fr; }
      }

      /* ── Analytics ────────────────────────────────────────────────────── */
      #section-analytics {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .analytics-toolbar {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      #analytics-summary {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.65rem;
      }

      .stat-card {
        background: rgba(0, 0, 0, 0.15);
        border: 1px solid var(--divider);
        border-radius: 0.5rem;
        padding: 0.8rem 0.9rem;
      }

      .stat-card-value {
        font-size: 1.55rem;
        font-weight: 700;
        color: var(--text-high);
        line-height: 1;
      }

      .stat-card-label {
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-low);
        margin-top: 0.28rem;
      }

      #analytics-tables {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.65rem;
      }

      .analytics-panel {
        background: rgba(0, 0, 0, 0.15);
        border: 1px solid var(--divider);
        border-radius: 0.5rem;
        padding: 0.75rem;
      }

      .analytics-panel h3 {
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-low);
        margin: 0 0 0.55rem;
      }

      .bar-row {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        margin-bottom: 0.3rem;
      }

      .bar-label {
        font-size: 0.76rem;
        color: var(--text-mid);
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }

      .bar-track {
        width: 72px;
        height: 5px;
        background: rgba(255, 255, 255, 0.07);
        border-radius: 3px;
        overflow: hidden;
        flex-shrink: 0;
      }

      .bar-fill {
        height: 100%;
        background: var(--text-link);
        border-radius: 3px;
      }

      .bar-count {
        font-size: 0.72rem;
        color: var(--text-low);
        width: 2.2rem;
        text-align: right;
        flex-shrink: 0;
      }

      #unique-visitors-panel {
        background: rgba(0, 0, 0, 0.15);
        border: 1px solid var(--divider);
        border-radius: 0.5rem;
        padding: 0.75rem;
        overflow: hidden;
      }

      #unique-visitors-panel h3 {
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-low);
        margin: 0 0 0.55rem;
      }

      .visitors-scroll {
        overflow-y: auto;
        max-height: 320px;
      }

      .visitors-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.74rem;
      }

      .visitors-table th {
        text-align: left;
        padding: 0.28rem 0.45rem;
        color: var(--text-low);
        font-weight: 600;
        letter-spacing: 0.04em;
        border-bottom: 1px solid var(--divider);
        position: sticky;
        top: 0;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(4px);
      }

      .visitors-table td {
        padding: 0.28rem 0.45rem;
        color: var(--text-mid);
        border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        max-width: 180px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .visitors-table tr:last-child td { border-bottom: none; }
      .visitors-table td.td-ip    { font-family: monospace; font-size: 0.7rem; color: var(--text-high); }
      .visitors-table td.td-ts    { color: var(--text-low); white-space: nowrap; }
      .visitors-table td.td-count { color: var(--text-link); font-weight: 600; text-align: right; }

      #analytics-status {
        font-size: 0.8rem;
        color: var(--text-low);
      }

      /* ── Component insert toolbar ─────────────────────────────────────── */
      #component-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem;
        padding: 0.4rem 0;
        border-bottom: 1px solid var(--divider);
        margin-bottom: 0.4rem;
      }

      .comp-btn {
        background: none;
        color: var(--text-mid);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 0.25rem;
        cursor: pointer;
        font-family: system-ui, sans-serif;
        font-size: 0.7rem;
        padding: 0.15rem 0.5rem;
        transition: color 0.12s, border-color 0.12s;
      }

      .comp-btn:hover { color: var(--text-high); border-color: rgba(255, 255, 255, 0.3); }

      .comp-sep {
        font-size: 0.65rem;
        color: var(--text-low);
        align-self: center;
        margin-left: 0.25rem;
      }
    </style>
  </head>
  <body data-page="admin" data-basepath="../">

    <!-- ── Page layout ────────────────────────────────────────────────────── -->
    <div class="page-layout">
      <div id="layout-nav"></div>
      <div class="main-col">
        <div class="side-panel" id="admin-panel">

          <div id="admin-toolbar">
            <h2>Blog Admin</h2>
            <a href="../blog.html" style="font-size:0.8rem;color:var(--text-link);text-decoration:none;opacity:0.8;transition:opacity 0.12s" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.8">View Blog →</a>
            <button id="logout-btn">Sign out</button>
          </div>

          <div id="admin-section-tabs">
            <button class="admin-stab active" id="stab-blog">Blog</button>
            <button class="admin-stab" id="stab-links">Links</button>
            <button class="admin-stab" id="stab-analytics">Analytics</button>
          </div>

          <div id="section-blog">

          <div id="editor-layout">
            <div id="post-list">

                <div id="analytics-countries"></div>

              <div class="visitors-scroll">

                  <thead>
                    <tr>
                      <th>IP</th>
                      <th>Location</th>
                      <th>First Seen (MST)</th>
                      <th>Last Seen (MST)</th>
                      <th style="text-align:right">Visits</th>
                      <th></th>

    <script src="../assets/project-data.js"></script>
    <script src="../assets/layout.js"></script>
    <script src="../assets/script.js"></script>
    <script src="../assets/blog-storage.js"></script>
    <script>
      (function () {
        /** @type {string} Posts base URL from /config.cgi */
        let postsUrl = "/blog/posts";

        /** @type {"local"|"s3"} */
        let storageMode = "s3";

        /** @type {string|null} */
        let currentSlug = null;

        /** @type {boolean|null} null when no post is loaded */
        let currentPublished = null;

        /** @type {"html"|"preview"} */
        let currentMode = "html";

        /** Actual HTML with <img> tags */
        let htmlContent = "";

        /** @type {Array} */
        let posts = [];

        // ── DOM refs ─────────────────────────────────────────────────────
        const titleInput   = document.getElementById("field-title");
        const slugInput    = document.getElementById("field-slug");
        const dateInput    = document.getElementById("field-date");
        const descInput    = document.getElementById("field-desc");
        const wipInput     = document.getElementById("field-wip");
        const contentInput = document.getElementById("field-content");
        const previewPane  = document.getElementById("preview-pane");
        const statusEl     = document.getElementById("status");
        const deleteBtn    = document.getElementById("delete-btn");
        const publishBtn   = document.getElementById("publish-btn");
        const postListEl   = document.getElementById("post-list-items");
        const imgGrid      = document.getElementById("img-grid");
        const imgDropZone  = document.getElementById("img-drop-zone");
        const imgFileInput = document.getElementById("img-file-input");
        const tabHtml           = document.getElementById("tab-html");
        const tabPreview        = document.getElementById("tab-preview");
        const componentToolbar  = document.getElementById("component-toolbar");

        // ── API ───────────────────────────────────────────────────────────
        async function apiPost(path, body) {
          return fetch(path, {
            method: "POST",
            headers: { "X-CSRF-Token": getCsrfToken() },
            body,
          });
        }

        // Read CSRF token from cookie
        function getCsrfToken() {
          var name = "csrf_token=";
          var decoded = document.cookie.split(";").map(function(c){ return c.trim(); });
          for (var i = 0; i < decoded.length; i++) {
            if (decoded[i].indexOf(name) === 0) return decoded[i].substring(name.length);
          }
          return "";
        }

        // ── Utilities ─────────────────────────────────────────────────────
        function escapeHtml(s) {
          return s.replace(/&/g, "&amp;").replace(/</g, "&lt;")
                  .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        function setStatus(msg, isError) {
          statusEl.textContent = msg;
          statusEl.style.color = isError ? "var(--danger)" : "var(--text-link)";
        }

        // ── Image storage (server-side, per-slug directory in S3/MinIO) ──
        /** @type {string[]} filenames for the currently loaded slug */
        let currentImages = [];

        function imageUrl(slug, filename) {
          return "/blog/posts/" + slug + "/" + filename;
        }

        async function loadImages(slug) {
          if (!slug) { currentImages = []; renderImageGrid(null); return; }
          try {
            const r = await fetch("../cgi-bin/images.cgi?slug=" + encodeURIComponent(slug));
            currentImages = r.ok ? ((await r.json()).images || []) : [];
          } catch (_) { currentImages = []; }
          renderImageGrid(slug);
        }

        async function addImageFiles(slug, files) {
          if (!slug) { setStatus("Save the post first before uploading images.", true); return; }
          for (var i = 0; i < files.length; i++) {
            var file = files[i];
            var params = new URLSearchParams({ slug: slug, filename: file.name });
            var resp = await fetch("../cgi-bin/upload.cgi?" + params.toString(), {
              method: "POST",
              headers: {
                "X-CSRF-Token": getCsrfToken(),
                "Content-Type": file.type || "application/octet-stream",
              },
              body: file,
            });
            if (!resp.ok) {
              var errJson = await resp.json().catch(function () { return {}; });
              setStatus("Upload failed: " + (errJson.error || resp.status), true);
              return;
            }
          }
          await loadImages(slug);
        }

        async function removeImage(slug, filename) {
          await apiPost("../cgi-bin/delete-image.cgi", new URLSearchParams({ slug: slug, filename: filename }));
          await loadImages(slug);
        }

        // ── Image grid ────────────────────────────────────────────────────
        function renderImageGrid(slug) {
          imgGrid.innerHTML = "";
          if (!slug) return;
          currentImages.forEach(function (filename) {
            const thumb = document.createElement("div");
            thumb.className = "img-thumb";
            thumb.draggable = true;
            thumb.dataset.filename = filename;

            const el = document.createElement("img");
            el.src = imageUrl(slug, filename);
            el.alt = filename;

            const lbl = document.createElement("div");
            lbl.className = "img-thumb-name";
            lbl.textContent = filename;

            const del = document.createElement("button");
            del.className = "img-thumb-del";
            del.textContent = "×";
            del.title = "Remove";
            del.addEventListener("click", function (e) {
              e.stopPropagation();
              if (confirm('Remove "' + filename + '"?')) removeImage(slug, filename);
            });

            thumb.addEventListener("dragstart", function (e) {
              e.dataTransfer.setData("application/x-blog-image", filename);
              e.dataTransfer.effectAllowed = "copy";
            });

            thumb.appendChild(el);
            thumb.appendChild(lbl);
            thumb.appendChild(del);
            imgGrid.appendChild(thumb);
          });
        }

        // ── Session storage ───────────────────────────────────────────────
        function saveSession() {
          if (!currentSlug) return;
          sessionStorage.setItem("tebay_h_" + currentSlug, htmlContent);
        }

        // ── Sync textarea → htmlContent ───────────────────────────────────
        function syncFromTextarea() {
          htmlContent = contentInput.value;
        }

        // ── Tab switching ─────────────────────────────────────────────────
        function switchTab(mode) {
          syncFromTextarea();
          if (mode === "html") {
            currentMode = "html";
            contentInput.value        = htmlContent;
            contentInput.style.display = "";
            previewPane.style.display  = "none";
            tabHtml.classList.add("active");
            tabPreview.classList.remove("active");
            componentToolbar.style.display = "";
          } else {
            currentMode = "preview";
            htmlContent = contentInput.value;
            contentInput.style.display = "none";
            previewPane.style.display  = "block";
            previewPane.innerHTML      = htmlContent;
            tabHtml.classList.remove("active");
            tabPreview.classList.add("active");
            componentToolbar.style.display = "none";
          }
          saveSession();
        }

        tabHtml.addEventListener("click",    function () { switchTab("html"); });
        tabPreview.addEventListener("click", function () { switchTab("preview"); });

        // ── Get final HTML for saving ─────────────────────────────────────
        function getHtmlContent() {
          syncFromTextarea();
          return htmlContent;
        }

        // ── Publish button state ──────────────────────────────────────────
        function syncPublishBtn() {
          if (currentPublished === null) { publishBtn.style.display = "none"; return; }
          publishBtn.style.display = "";
          if (currentPublished) {
            publishBtn.textContent = "Unpublish";
            publishBtn.className   = "state-published";
            wipInput.checked  = false;
            wipInput.disabled = true;
          } else {
            publishBtn.textContent = "Publish";
            publishBtn.className   = "state-draft";
            wipInput.disabled = false;
          }
        }

        // ── Post list ─────────────────────────────────────────────────────
        function renderPostList() {
          postListEl.innerHTML = "";
          [...posts].sort(function (a, b) { return b.date.localeCompare(a.date); })
            .forEach(function (post) {
              const item = document.createElement("div");
              item.className = "post-item" + (post.slug === currentSlug ? " active" : "");
              const badgeClass = post.published ? "badge--published" : "badge--draft";
              item.innerHTML =
                '<div class="post-item-row">' +
                  '<span class="post-item-title">' + escapeHtml(post.title) + "</span>" +
                  '<span class="badge ' + badgeClass + '">' + (post.published ? "Live" : "Draft") + "</span>" +
                "</div>" +
                '<div class="post-item-date">' + post.date + "</div>";
              item.addEventListener("click", function () { loadPost(post.slug, post.published); });
              postListEl.appendChild(item);
            });
        }

        async function loadPosts() {
          if (storageMode === "local") {
            posts = BlogStorage.getAllPosts();
            renderPostList();
            return;
          }
          try {
            const response = await fetch("../cgi-bin/posts.cgi");
            posts = response.ok ? await response.json() : [];
          } catch (_) {
            setStatus("Could not load posts from server.", true);
          }
          renderPostList();
        }

        // ── Editor ────────────────────────────────────────────────────────
        async function loadPost(slug, published) {
          try {
            let title, date, desc, content, wip = false;
            if (storageMode === "local") {
              const post = BlogStorage.getPost(slug);
              if (!post) throw new Error("Not found");
              ({ title, date, desc, content } = post);
              wip = !!post.wip;
            } else {
              const filename = published ? slug + "/index.html" : slug + "/draft.html";
              const response = await fetch(postsUrl + "/" + filename);
              if (!response.ok) throw new Error("Not found");
              const raw = await response.text();
              const nl  = raw.indexOf("\n");
              const match = raw.substring(0, nl).match(/^<!-- (.*) -->$/);
              if (!match) throw new Error("Invalid post format");
              const meta = JSON.parse(match[1]);
              ({ title, date, desc } = meta);
              wip     = !!meta.wip;
              content = raw.substring(nl + 1);
            }
            titleInput.value = title;
            slugInput.value  = slug;
            dateInput.value  = date;
            descInput.value  = desc;
            wipInput.checked = wip;
            currentSlug      = slug;
            currentPublished = published;

            await loadImages(slug);

            const sh = sessionStorage.getItem("tebay_h_" + slug);
            htmlContent = sh || content || "";
            contentInput.value = htmlContent;
            contentInput.style.display = "";
            previewPane.style.display  = "none";

            deleteBtn.style.display = "";
            syncPublishBtn();
            setStatus("");
            renderPostList();
          } catch (err) {
            setStatus("Error loading post: " + err.message, true);
          }
        }

        function clearEditor() {
          currentSlug      = null;
          currentPublished = null;
          currentMode      = "html";
          currentImages    = [];
          htmlContent      = "";
          titleInput.value   = "";
          slugInput.value    = "";
          dateInput.value    = new Date().toISOString().slice(0, 10);
          descInput.value    = "";
          wipInput.checked   = false;
          wipInput.disabled  = false;
          contentInput.value = "";
          contentInput.style.display = "";
          previewPane.style.display  = "none";
          tabHtml.classList.add("active");
          tabPreview.classList.remove("active");
          componentToolbar.style.display = "";
          deleteBtn.style.display = "none";
          syncPublishBtn();
          setStatus("");
          renderImageGrid(null);
          renderPostList();
        }

        // Auto-slug from title
        titleInput.addEventListener("input", function () {
          if (!currentSlug) {
            slugInput.value = titleInput.value
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, "-")
              .replace(/^-|-$/g, "");
          }
        });

        // ── Image upload ──────────────────────────────────────────────────
        function handleFiles(files) {
          const slug = currentSlug || slugInput.value.trim();
          addImageFiles(slug, Array.from(files).filter(function (f) { return f.type.startsWith("image/"); }));
        }

        imgDropZone.addEventListener("click", function () { imgFileInput.click(); });
        imgFileInput.addEventListener("change", function () {
          if (imgFileInput.files.length) handleFiles(imgFileInput.files);
          imgFileInput.value = "";
        });
        imgDropZone.addEventListener("dragover", function (e) {
          e.preventDefault();
          imgDropZone.classList.add("drag-over");
        });
        imgDropZone.addEventListener("dragleave", function () {
          imgDropZone.classList.remove("drag-over");
        });
        imgDropZone.addEventListener("drop", function (e) {
          e.preventDefault();
          imgDropZone.classList.remove("drag-over");
          if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
        });

        // ── Drag image from grid into textarea ────────────────────────────
        contentInput.addEventListener("dragover", function (e) {
          if (e.dataTransfer.types.indexOf("application/x-blog-image") >= 0) {
            e.preventDefault();
            e.dataTransfer.dropEffect = "copy";
          }
        });
        contentInput.addEventListener("drop", function (e) {
          const filename = e.dataTransfer.getData("application/x-blog-image");
          if (!filename) return;
          e.preventDefault();
          const insert = '<img src="' + imageUrl(currentSlug, filename) + '" alt="' + escapeHtml(filename) + '" style="max-width:100%;">';
          const s = contentInput.selectionStart;
          const end = contentInput.selectionEnd;
          contentInput.value = contentInput.value.substring(0, s) + insert + contentInput.value.substring(end);
          contentInput.selectionStart = contentInput.selectionEnd = s + insert.length;
          contentInput.focus();
        });

        // ── Save ──────────────────────────────────────────────────────────
        document.getElementById("save-btn").addEventListener("click", async function () {
          const slug  = slugInput.value.trim();
          const title = titleInput.value.trim();
          if (!slug || !title) { setStatus("Slug and title are required.", true); return; }
          setStatus("Saving…");
          const content = getHtmlContent();
          if (storageMode === "local") {
            const saved = BlogStorage.savePost({
              slug, title, date: dateInput.value, desc: descInput.value,
              content, wip: wipInput.checked,
            });
            currentSlug      = slug;
            currentPublished = saved.published;
            deleteBtn.style.display = "";
            syncPublishBtn();
            setStatus("Saved.");
            renderImageGrid(slug);
            await loadPosts();
            return;
          }
          const response = await apiPost("../cgi-bin/save.cgi", new URLSearchParams({
            slug, title, date: dateInput.value, desc: descInput.value,
            content, wip: wipInput.checked,
          }));
          if (!response) return;
          const json = await response.json();
          if (json.ok) {
            currentSlug      = slug;
            currentPublished = json.published;
            sessionStorage.removeItem("tebay_h_" + slug);
            deleteBtn.style.display = "";
            syncPublishBtn();
            setStatus("Saved.");
            renderImageGrid(slug);
            await loadPosts();
          } else {
            setStatus("Error: " + (json.error || "unknown"), true);
          }
        });

        // ── Publish toggle ────────────────────────────────────────────────
        publishBtn.addEventListener("click", async function () {
          if (!currentSlug) return;
          setStatus((currentPublished ? "Unpublish" : "Publish") + "ing…");
          if (storageMode === "local") {
            const post = BlogStorage.togglePublished(currentSlug);
            currentPublished = post.published;
            wipInput.checked = !!post.wip;
            syncPublishBtn();
            setStatus(post.published ? "Published." : "Unpublished.");
            await loadPosts();
            return;
          }
          const response = await apiPost("../cgi-bin/publish.cgi", new URLSearchParams({ slug: currentSlug }));
          if (!response) return;
          const json = await response.json();
          if (json.ok) {
            currentPublished = json.published;
            syncPublishBtn();
            setStatus(json.published ? "Published." : "Unpublished.");
            await loadPosts();
          } else {
            setStatus("Error: " + (json.error || "unknown"), true);
          }
        });

        // ── Delete ────────────────────────────────────────────────────────
        deleteBtn.addEventListener("click", async function () {
          if (!currentSlug) return;
          if (!confirm('Delete "' + titleInput.value + '"?')) return;
          setStatus("Deleting…");
          if (storageMode === "local") {
            BlogStorage.deletePost(currentSlug);
            clearEditor();
            await loadPosts();
            setStatus("Deleted.");
            return;
          }
          const response = await apiPost("../cgi-bin/delete.cgi", new URLSearchParams({ slug: currentSlug }));
          if (!response) return;
          const json = await response.json();
          if (json.ok) {
            clearEditor();
            await loadPosts();
            setStatus("Deleted.");
          } else {
            setStatus("Error: " + (json.error || "unknown"), true);
          }
        });

        document.getElementById("new-btn").addEventListener("click", clearEditor);
        document.getElementById("clear-btn").addEventListener("click", clearEditor);

        // ── HTML document import ──────────────────────────────────────────
        var importFileInput = document.getElementById("import-file-input");

        document.getElementById("import-btn").addEventListener("click", function () {
          importFileInput.click();
        });

        importFileInput.addEventListener("change", function () {
          var file = importFileInput.files[0];
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function (e) { importHtmlDocument(e.target.result, file.name); };
          reader.readAsText(file);
          importFileInput.value = "";
        });

        function importHtmlDocument(html, filename) {
          var doc = new DOMParser().parseFromString(html, "text/html");

          var rawTitle = doc.querySelector("title") ? doc.querySelector("title").textContent : "";
          var title = rawTitle.replace(/\s*\|.*$/, "").trim();
          var descMeta = doc.querySelector('meta[name="description"]');
          var desc  = descMeta ? (descMeta.getAttribute("content") || "") : "";
          var slug  = title
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/^-|-$/g, "");

          var date = "";
          var bylineEl = doc.querySelector(".byline");
          if (bylineEl) {
            var bylineMatch = bylineEl.textContent.match(/([A-Za-z]+)\s+(\d{4})/);
            if (bylineMatch) {
              var months = { January:1, February:2, March:3, April:4, May:5, June:6,
                             July:7, August:8, September:9, October:10, November:11, December:12 };
              var mo = months[bylineMatch[1]];
              if (mo) date = bylineMatch[2] + "-" + String(mo).padStart(2, "0") + "-01";
            }
          }

          var contentRoot = doc.querySelector(".wrap") || doc.body;
          contentRoot.querySelectorAll("style, script").forEach(function (el) { el.remove(); });
          var content = contentRoot.innerHTML.trim();

          clearEditor();
          titleInput.value   = title;
          slugInput.value    = slug;
          descInput.value    = desc;
          if (date) dateInput.value = date;
          htmlContent        = content;
          contentInput.value = content;
          setStatus("Imported from " + filename + " — review and save.");
        }

        // ── Component snippets ────────────────────────────────────────────
        var componentSnippets = {
          "kicker":      '<p class="kicker">Category &middot; Subcategory</p>',
          "subtitle":    '<p class="subtitle">Lead sentence or subtitle text.</p>',
          "byline":      '<p class="byline">Nathan Tebay &middot; Month Year</p>',
          "pullquote":   '<div class="pullquote">Pull quote text goes here.</div>',
          "lesson-card": '<div class="lesson-card">\n  <div class="lc-head">Heading</div>\n  <div class="lc-body">Body text.</div>\n</div>',
          "timeline":    '<div class="timeline">\n  <div class="tl-item">\n    <div class="tl-left"><div class="tl-dot"></div><div class="tl-line"></div></div>\n    <div class="tl-content">\n      <div class="tl-label">Label</div>\n      <div class="tl-text"><strong>Event</strong> Description.</div>\n    </div>\n  </div>\n</div>',
          "tag-red":     '<span class="tag tag-red">label</span>',
          "tag-amber":   '<span class="tag tag-amber">label</span>',
          "tag-gray":    '<span class="tag tag-gray">label</span>',
          "tag-blue":    '<span class="tag tag-blue">label</span>',
        };

        componentToolbar.addEventListener("click", function (e) {
          var btn = e.target.closest(".comp-btn");
          if (!btn) return;
          var snippet = componentSnippets[btn.dataset.component];
          if (!snippet) return;
          var s   = contentInput.selectionStart;
          var end = contentInput.selectionEnd;
          var nl  = (s > 0 && contentInput.value[s - 1] !== "\n") ? "\n" : "";
          contentInput.value = contentInput.value.substring(0, s) + nl + snippet + "\n" + contentInput.value.substring(end);
          contentInput.selectionStart = contentInput.selectionEnd = s + nl.length + snippet.length + 1;
          contentInput.focus();
          htmlContent = contentInput.value;
        });

        document.getElementById("logout-btn").addEventListener("click", function () {
          window.location.href = "/cgi-bin/logout.cgi";
        });

        // ── Bootstrap ─────────────────────────────────────────────────────
        (async function init() {
          try {
            const cfg = await (await fetch("../config.cgi")).json();
            postsUrl    = cfg.postsUrl;
            storageMode = cfg.storage || "s3";
          } catch (_) { /* config.cgi not available, keeping s3 mode defaults */ }

          clearEditor();
          await loadPosts();
        })();

        // ── Admin section tabs ────────────────────────────────────────────
        var _linksLoaded = false;
        var _analyticsLoaded = false;

        function switchAdminSection(section) {
          ["blog", "links", "analytics"].forEach(function (s) {
            document.getElementById("section-" + s).style.display = s === section ? "" : "none";
            document.getElementById("stab-" + s).classList.toggle("active", s === section);
          });
          if (section === "links" && !_linksLoaded) {
            _linksLoaded = true;
            loadLinksData();
          }
          if (section === "analytics" && !_analyticsLoaded) {
            _analyticsLoaded = true;
            loadAnalyticsData();
          }
        }

        document.getElementById("stab-blog").addEventListener("click",      function () { switchAdminSection("blog"); });
        document.getElementById("stab-links").addEventListener("click",     function () { switchAdminSection("links"); });
        document.getElementById("stab-analytics").addEventListener("click", function () { switchAdminSection("analytics"); });

        // ── Links editor ──────────────────────────────────────────────────
        var catListEl    = document.getElementById("cat-list");
        var linksListEl  = document.getElementById("links-list");
        var linksStatusEl = document.getElementById("links-status");

        function setLinksStatus(msg, isErr) {
          linksStatusEl.textContent = msg;
          linksStatusEl.style.color = isErr ? "var(--danger)" : "var(--text-link)";
        }

        function linkGenId() {
          return Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
        }

        function getCurrentCategories() {
          var cats = [];
          catListEl.querySelectorAll(".cat-row").forEach(function (row) {
            cats.push({ id: row.dataset.id, name: row.querySelector("input").value });
          });
          return cats;
        }

        function getAllLinkSelects() {
          return linksListEl.querySelectorAll(".link-cat");
        }

        function addOptionToAllSelects(catId, catName) {
          getAllLinkSelects().forEach(function (sel) {
            var opt = document.createElement("option");
            opt.value = catId;
            opt.textContent = catName || "(unnamed)";
            sel.appendChild(opt);
          });
        }

        function updateOptionInAllSelects(catId, catName) {
          getAllLinkSelects().forEach(function (sel) {
            var opt = sel.querySelector('option[value="' + catId + '"]');
            if (opt) opt.textContent = catName || "(unnamed)";
          });
        }

        function removeOptionFromAllSelects(catId) {
          getAllLinkSelects().forEach(function (sel) {
            var opt = sel.querySelector('option[value="' + catId + '"]');
            if (opt) {
              if (sel.value === catId) sel.value = "";
              opt.remove();
            }
          });
        }

        function buildCatRow(id, name) {
          var row = document.createElement("div");
          row.className = "cat-row";
          row.dataset.id = id;

          var movebtns = document.createElement("div");
          movebtns.className = "cat-move-btns";

          var upBtn = document.createElement("button");
          upBtn.className = "cat-move-btn";
          upBtn.textContent = "▲";
          upBtn.title = "Move up";
          upBtn.addEventListener("click", function () {
            var prev = row.previousElementSibling;
            if (prev) catListEl.insertBefore(row, prev);
          });

          var downBtn = document.createElement("button");
          downBtn.className = "cat-move-btn";
          downBtn.textContent = "▼";
          downBtn.title = "Move down";
          downBtn.addEventListener("click", function () {
            var next = row.nextElementSibling;
            if (next) catListEl.insertBefore(next, row);
          });

          movebtns.appendChild(upBtn);
          movebtns.appendChild(downBtn);

          var inp = document.createElement("input");
          inp.type = "text";
          inp.value = name;
          inp.placeholder = "Category name";
          inp.spellcheck = true;
          inp.setAttribute("data-gramm", "true");
          inp.addEventListener("input", function () {
            updateOptionInAllSelects(id, inp.value);
          });

          var del = document.createElement("button");
          del.className = "icon-btn danger";
          del.textContent = "×";
          del.title = "Delete category";
          del.addEventListener("click", function () {
            removeOptionFromAllSelects(id);
            row.remove();
          });

          row.appendChild(movebtns);
          row.appendChild(inp);
          row.appendChild(del);
          return row;
        }

        function buildLinkCard(link, categories) {
          var card = document.createElement("div");
          card.className = "link-card";
          card.dataset.id = link.id;

          var row1 = document.createElement("div");
          row1.className = "link-row";

          var titleInp = document.createElement("input");
          titleInp.type = "text";
          titleInp.className = "link-input link-title";
          titleInp.placeholder = "Title";
          titleInp.value = link.title || "";
          titleInp.spellcheck = true;
          titleInp.setAttribute("data-gramm", "true");

          var urlInp = document.createElement("input");
          urlInp.type = "url";
          urlInp.className = "link-input link-url";
          urlInp.placeholder = "https://";
          urlInp.value = link.url || "";

          row1.appendChild(titleInp);
          row1.appendChild(urlInp);

          var descInp = document.createElement("textarea");
          descInp.className = "link-input link-desc";
          descInp.placeholder = "Description (optional)";
          descInp.value = link.desc || "";
          descInp.spellcheck = true;
          descInp.setAttribute("data-gramm", "true");
          descInp.setAttribute("data-gramm_editor", "true");

          var footer = document.createElement("div");
          footer.className = "link-card-footer";

          var sel = document.createElement("select");
          sel.className = "link-select link-cat";
          var blank = document.createElement("option");
          blank.value = "";
          blank.textContent = "— uncategorized —";
          sel.appendChild(blank);
          categories.forEach(function (cat) {
            var opt = document.createElement("option");
            opt.value = cat.id;
            opt.textContent = cat.name || "(unnamed)";
            opt.selected = (cat.id === link.categoryId);
            sel.appendChild(opt);
          });

          var del = document.createElement("button");
          del.className = "icon-btn danger";
          del.textContent = "×";
          del.title = "Delete link";
          del.addEventListener("click", function () { card.remove(); });

          footer.appendChild(sel);
          footer.appendChild(del);

          card.appendChild(row1);
          card.appendChild(descInp);
          card.appendChild(footer);
          return card;
        }

        async function loadLinksData() {
          try {
            var r = await fetch("../cgi-bin/links.cgi");
            var data = r.ok ? await r.json() : { categories: [], links: [] };
            catListEl.innerHTML = "";
            linksListEl.innerHTML = "";
            var cats = data.categories || [];
            cats.forEach(function (cat) {
              catListEl.appendChild(buildCatRow(cat.id, cat.name));
            });
            (data.links || []).forEach(function (link) {
              linksListEl.appendChild(buildLinkCard(link, cats));
            });
          } catch (_) {
            setLinksStatus("Could not load links.", true);
          }
        }

        document.getElementById("add-cat-btn").addEventListener("click", function () {
          var id = linkGenId();
          var row = buildCatRow(id, "");
          catListEl.appendChild(row);
          addOptionToAllSelects(id, "");
          row.querySelector("input").focus();
        });

        document.getElementById("add-link-btn").addEventListener("click", function () {
          var cats = getCurrentCategories();
          var card = buildLinkCard({ id: linkGenId(), url: "", title: "", desc: "", categoryId: "" }, cats);
          linksListEl.prepend(card);
          card.querySelector(".link-title").focus();
        });

        document.getElementById("links-save-btn").addEventListener("click", async function () {
          setLinksStatus("Saving…");
          var categories = getCurrentCategories();
          var links = [];
          linksListEl.querySelectorAll(".link-card").forEach(function (card) {
            links.push({
              id: card.dataset.id,
              url:        card.querySelector(".link-url").value.trim(),
              title:      card.querySelector(".link-title").value.trim(),
              desc:       card.querySelector(".link-desc").value.trim(),
              categoryId: card.querySelector(".link-cat").value
            });
          });
          try {
            var r = await fetch("../cgi-bin/links.cgi", {
              method: "POST",
              headers: { "Content-Type": "application/json", "X-CSRF-Token": getCsrfToken() },
              body: JSON.stringify({ categories: categories, links: links })
            });
            var json = await r.json();
            setLinksStatus(json.ok ? "Saved." : "Error: " + (json.error || "unknown"), !json.ok);
          } catch (_) {
            setLinksStatus("Save failed.", true);
          }
        });
        // ── Analytics ──────────────────────────────────────────────────────
        var analyticsStatusEl = document.getElementById("analytics-status");

        function setAnalyticsStatus(msg) {
          analyticsStatusEl.textContent = msg;
        }

        async function loadAnalyticsData() {
          setAnalyticsStatus("Loading…");
          try {
            var r = await fetch("../cgi-bin/analytics.cgi");
            if (!r.ok) throw new Error("HTTP " + r.status);
            var data = await r.json();
            renderAnalytics(data.visits || []);
            setAnalyticsStatus("Updated " + new Date().toLocaleTimeString());
          } catch (err) {
            setAnalyticsStatus("Error: " + err.message);
          }
        }

        function renderBarList(containerId, counts, maxItems) {
          var container = document.getElementById(containerId);
          container.innerHTML = "";
          var sorted = Object.keys(counts)
            .map(function (k) { return { label: k, count: counts[k] }; })
            .sort(function (a, b) { return b.count - a.count; })
            .slice(0, maxItems || 10);
          if (!sorted.length) {
            container.textContent = "No data";
            return;
          }
          var max = sorted[0].count;
          sorted.forEach(function (item) {
            var row = document.createElement("div");
            row.className = "bar-row";

            var label = document.createElement("span");
            label.className = "bar-label";
            label.title = item.label;
            label.textContent = item.label;

            var track = document.createElement("div");
            track.className = "bar-track";
            var fill = document.createElement("div");
            fill.className = "bar-fill";
            fill.style.width = Math.round((item.count / max) * 100) + "%";
            track.appendChild(fill);

            var count = document.createElement("span");
            count.className = "bar-count";
            count.textContent = item.count;

            row.appendChild(label);
            row.appendChild(track);
            row.appendChild(count);
            container.appendChild(row);
          });
        }

        function renderAnalytics(visits) {
          var today = new Date().toISOString().slice(0, 10);
          var weekAgo = new Date(Date.now() - 7 * 86400000).toISOString().slice(0, 10);

          var uniqueIPs = {};
          var todayCount = 0;
          var weekCount = 0;
          var pageCounts = {};
          var countryCounts = {};
          var blogSlugCounts = {};

          visits.forEach(function (v) {
            if (v.ip) uniqueIPs[v.ip] = true;
            var day = v.ts ? v.ts.slice(0, 10) : "";
            if (day === today) todayCount++;
            if (day >= weekAgo) weekCount++;
            var page = v.page || "/";
            pageCounts[page] = (pageCounts[page] || 0) + 1;
            if (v.country) countryCounts[v.country] = (countryCounts[v.country] || 0) + 1;
            if (v.slug) blogSlugCounts[v.slug] = (blogSlugCounts[v.slug] || 0) + 1;
          });

          document.getElementById("stat-total").textContent  = visits.length.toLocaleString();
          document.getElementById("stat-unique").textContent = Object.keys(uniqueIPs).length.toLocaleString();
          document.getElementById("stat-today").textContent  = todayCount.toLocaleString();
          document.getElementById("stat-week").textContent   = weekCount.toLocaleString();

          renderBarList("analytics-pages", pageCounts, 10);
          renderBarList("analytics-countries", countryCounts, 10);
          renderBarList("analytics-blog-posts", blogSlugCounts, 10);

          var visitorMap = {};
          visits.forEach(function (v) {
            var ip = v.ip || "unknown";
            if (!visitorMap[ip]) {
              visitorMap[ip] = {
                ip: ip,
                location: [v.city, v.country].filter(Boolean).join(", ") || "—",
                first: v.ts || "",
                last: v.ts || "",
                count: 0,
              };
            }
            var entry = visitorMap[ip];
            if (!entry.location || entry.location === "—") {
              entry.location = [v.city, v.country].filter(Boolean).join(", ") || "—";
            }
            if (v.ts && v.ts < entry.first) entry.first = v.ts;
            if (v.ts && v.ts > entry.last)  entry.last  = v.ts;
            entry.count++;
          });

          var sortedVisitors = Object.values(visitorMap)
            .sort(function (a, b) { return b.last.localeCompare(a.last); });

          var uvTbody = document.getElementById("unique-visitors-tbody");
          uvTbody.innerHTML = "";
          sortedVisitors.forEach(function (entry) {
            var tr = document.createElement("tr");
            var fmtTs = function (ts) {
              if (!ts) return "—";
              var d = new Date(ts);
              return d.toLocaleString("en-CA", { timeZone: "America/Denver", hour12: false })
                       .replace(",", "");
            };
            [
              { cls: "td-ip",    val: entry.ip },
              { cls: "",         val: entry.location },
              { cls: "td-ts",    val: fmtTs(entry.first) },
              { cls: "td-ts",    val: fmtTs(entry.last) },
              { cls: "td-count", val: entry.count },
            ].forEach(function (col) {
              var td = document.createElement("td");
              if (col.cls) td.className = col.cls;
              td.textContent = col.val;
              td.title = String(col.val);
              tr.appendChild(td);
            });
            var tdDel = document.createElement("td");
            var delBtn = document.createElement("button");
            delBtn.className = "secondary";
            delBtn.style.cssText = "font-size:0.7rem;padding:0.15rem 0.5rem;";
            delBtn.textContent = "✕";
            delBtn.title = "Delete all visits from this IP";
            delBtn.addEventListener("click", function () { purgeVisitorIP(entry.ip, tr); });
            tdDel.appendChild(delBtn);
            tr.appendChild(tdDel);
            uvTbody.appendChild(tr);
          });
        }

        async function purgeVisitorIP(ip, rowEl) {
          if (!confirm("Delete all recorded visits from " + ip + "?")) return;
          var csrfToken = document.cookie.split(";").map(function (c) { return c.trim(); })
            .find(function (c) { return c.startsWith("csrf_token="); });
          csrfToken = csrfToken ? csrfToken.split("=")[1] : "";
          try {
            var r = await fetch("../cgi-bin/purge-visits.cgi", {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded", "X-CSRF-Token": csrfToken },
              body: "ip=" + encodeURIComponent(ip),
            });
            var data = await r.json();
            if (data.ok) {
              rowEl.remove();
              analyticsStatusEl.textContent = "Removed " + (data.removed || 0) + " record(s) for " + ip;
            } else {
              analyticsStatusEl.textContent = "Error: " + (data.error || "unknown");
            }
          } catch (e) {
            analyticsStatusEl.textContent = "Request failed";
          }
        }

        document.getElementById("analytics-refresh-btn").addEventListener("click", function () {
          _analyticsLoaded = true;
          loadAnalyticsData();
        });

      })();
    </script>
  </body>
</html>
